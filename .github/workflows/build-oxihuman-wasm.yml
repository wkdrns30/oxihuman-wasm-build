name: Diagnose OxiHuman WASM v0.2.1

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout official OxiHuman v0.2.1
        uses: actions/checkout@v4
        with:
          repository: cool-japan/oxihuman
          ref: v0.2.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: taiki-e/install-action@wasm-pack

      - name: Build and locate browser WASM
        run: |
          wasm-pack build --release --target web --out-dir demo/pkg crates/oxihuman-wasm \
            --no-default-features --features bindgen

          echo "=== CURRENT DIRECTORY ==="
          pwd

          echo "=== ALL GENERATED WASM FILES ==="
          find . -type f -name "*.wasm" -print | sort

          echo "=== ALL GENERATED JS FILES UNDER OXIHUMAN WASM ==="
          find crates/oxihuman-wasm -type f -name "*.js" -print | sort

          echo "=== REPORTED DEMO PKG ==="
          find crates/oxihuman-wasm/demo/pkg -maxdepth 2 -type f -print | sort || true

          echo "=== OTHER DEMO/PKG DIRECTORIES ==="
          find . -type d \( -name pkg -o -name demo \) -print | sort
