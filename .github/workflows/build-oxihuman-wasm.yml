name: Build OxiHuman WASM v0.2.1 FINAL

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout official OxiHuman v0.2.1
        uses: actions/checkout@v4
        with:
          repository: cool-japan/oxihuman
          ref: v0.2.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: taiki-e/install-action@wasm-pack

      - name: Build browser WASM
        run: |
          wasm-pack build --release --target web --out-dir demo/pkg crates/oxihuman-wasm \
            --no-default-features --features bindgen

          test -f crates/oxihuman-wasm/demo/pkg/oxihuman_wasm.js
          test -f crates/oxihuman-wasm/demo/pkg/oxihuman_wasm_bg.wasm

          sha256sum \
            crates/oxihuman-wasm/demo/pkg/oxihuman_wasm.js \
            crates/oxihuman-wasm/demo/pkg/oxihuman_wasm_bg.wasm \
            | tee WASM_SHA256.txt

          wc -c \
            crates/oxihuman-wasm/demo/pkg/oxihuman_wasm.js \
            crates/oxihuman-wasm/demo/pkg/oxihuman_wasm_bg.wasm \
            | tee WASM_BYTES.txt

      - name: Upload verified build outputs
        uses: actions/upload-artifact@v4
        with:
          name: oxihuman-wasm-v0.2.1
          if-no-files-found: error
          retention-days: 7
          path: |
            crates/oxihuman-wasm/demo/pkg/oxihuman_wasm.js
            crates/oxihuman-wasm/demo/pkg/oxihuman_wasm_bg.wasm
            WASM_SHA256.txt
            WASM_BYTES.txt
